# Lokal ishlab chiqish uchun infratuzilma: Postgres (PostGIS), Redis, SeaweedFS (S3)
name: mehr

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mehr
      POSTGRES_PASSWORD: mehr_dev_password
      POSTGRES_DB: mehr
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mehr"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  # S3-mos fayl ombori (MinIO o'rniga — MinIO image'lari endi tarqatilmaydi)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333", "9333:9333"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Bucketlarni yaratadi: media va documents (alohida, shifrlangan hujjatlar)
  s3-init:
    image: amazon/aws-cli:latest
    depends_on: [seaweedfs]
    environment:
      AWS_ACCESS_KEY_ID: mehr
      AWS_SECRET_ACCESS_KEY: mehr_dev_password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do aws --endpoint-url http://seaweedfs:8333 s3 ls >/dev/null 2>&1 && break; sleep 1; done;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://mehr-media || true;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://mehr-documents || true;
      aws --endpoint-url http://seaweedfs:8333 s3 ls"

volumes:
  pgdata:
  redisdata:
  s3data:
