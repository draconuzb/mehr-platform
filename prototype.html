<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: chap — ekranlar ro'yxati (prototip navigatori), markaz — telefon ramkasi yoki desktop admin oynasi */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F3F6F5; --ink:#13222A; --muted:#5A6A71; --line:#D9E1E0;
  --accent:#0E6B75; --accent-ink:#FFFFFF; --accent-soft:#D5EAEA;
  --saffron:#B57A0C; --saffron-soft:#F7EBD0;
  --danger:#BE342D; --danger-soft:#F8DDDA; --ok:#2B7A4C; --ok-soft:#DBEFE2;
  --frame:#0D181E;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Golos Text", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1317; --surface:#132027; --surface-2:#192830; --ink:#E4EDEF; --muted:#91A3AA; --line:#25353D;
  --accent:#4DB8C2; --accent-ink:#04262A; --accent-soft:#163A3E;
  --saffron:#E2AE48; --saffron-soft:#372C13;
  --danger:#F0807A; --danger-soft:#3C1D1B; --ok:#62C690; --ok-soft:#173526;
  --frame:#000000; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1317; --surface:#132027; --surface-2:#192830; --ink:#E4EDEF; --muted:#91A3AA; --line:#25353D;
  --accent:#4DB8C2; --accent-ink:#04262A; --accent-soft:#163A3E;
  --saffron:#E2AE48; --saffron-soft:#372C13;
  --danger:#F0807A; --danger-soft:#3C1D1B; --ok:#62C690; --ok-soft:#173526;
  --frame:#000000; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%}
.nav{border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav li button{width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;display:flex;gap:8px;align-items:baseline}
.nav li button .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;width:18px}
.nav li button:hover{background:var(--surface-2)}
.nav li button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.toggle{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px dashed var(--line);border-radius:8px;font-size:13px}
.toggle input{margin-top:3px}
.navsel{display:none}
.groups{display:flex;flex-direction:column;gap:14px}

.stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:28px;padding-inline:16px;min-width:0}
.caption{max-width:560px;text-align:center}
.caption h1{font-family:var(--f-display);font-size:22px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.caption p{margin:0;color:var(--muted)}

.phone{width:370px;max-width:100%;height:760px;border:11px solid var(--frame);border-radius:44px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.desk{width:min(100%,1000px);height:640px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;display:flex;box-shadow:0 30px 60px -30px rgba(0,0,0,.3)}

/* Ilova ichidagi elementlar */
.hdr{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:none}
.hdr .t{font-family:var(--f-display);font-weight:700;font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .t small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.ib{border:0;background:none;padding:4px 6px;border-radius:6px;font-size:16px}
.sos{border:0;background:var(--danger);color:#fff;font-weight:700;font-size:12px;letter-spacing:.06em;padding:5px 10px;border-radius:999px}
.content{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;border-top:1px solid var(--line);flex:none;background:var(--surface)}
.tabs button{flex:1;border:0;background:none;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted)}
.tabs button .i{font-size:18px;filter:grayscale(1);opacity:.7}
.tabs button[aria-current="true"]{color:var(--accent);font-weight:600}
.tabs button[aria-current="true"] .i{filter:none;opacity:1}
.tabs button[disabled]{opacity:.4;cursor:not-allowed}

.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--accent);padding:8px}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.muted{color:var(--muted)}
.sm{font-size:12px}
h2.s{font-family:var(--f-display);font-size:17px;margin:0;letter-spacing:-.01em}
.sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0}

.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);text-align:left;padding:0;width:100%}
.card .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.ph{background:
   repeating-linear-gradient(135deg, var(--accent-soft) 0 10px, transparent 10px 20px),
   linear-gradient(var(--saffron-soft), var(--saffron-soft));
   display:flex;align-items:flex-end;justify-content:flex-start;color:var(--muted);font-size:11px;padding:8px;position:relative}
.ph .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;opacity:.35;transform:rotate(-18deg);letter-spacing:.1em}
.ttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ttl b{font-family:var(--f-display);font-size:16px}
.pct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12.5px}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.why{font-size:12.5px;color:var(--ink)}
.why::before{content:"✦ ";color:var(--saffron)}
.badge{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--saffron);font-weight:600}
.banner{border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;background:var(--accent-soft)}
.banner.warn{background:var(--saffron-soft)}
.banner.bad{background:var(--danger-soft);color:var(--danger)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list>*{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.list>*:last-child{border-bottom:0}
.st-ok{color:var(--ok)} .st-warn{color:var(--saffron)} .st-bad{color:var(--danger)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink);width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface-2);padding:9px 6px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.scale{display:flex;align-items:center;gap:8px;font-size:12px}
.scale input{flex:1;accent-color:var(--accent)}

/* Chat */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 11px;border-radius:14px;font-size:13.5px}
.msg .who{font-size:11px;font-weight:600;color:var(--accent);display:block;margin-bottom:2px}
.msg.in{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.out{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg.held{background:var(--saffron-soft);color:var(--ink);align-self:flex-end;border:1px dashed var(--saffron)}
.msg .tm{display:block;text-align:right;font-size:10px;opacity:.7;margin-top:2px}
.composer{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);flex:none;align-items:center}
.composer .inp{border-radius:999px;padding:9px 14px}

/* Stepper */
.steps{display:flex;flex-direction:column;gap:0}
.steps li{list-style:none;display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:7px 0;position:relative;align-items:center}
.steps .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);justify-self:center}
.steps .done .dot{background:var(--ok);border-color:var(--ok)}
.steps .cur .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.steps .cur{font-weight:600}
.steps ol{margin:0;padding:0}

.sosbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;text-align:left;font-size:15px;font-weight:600;display:flex;gap:12px;align-items:center;width:100%}
.sosbtn[aria-pressed="true"]{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}

/* Admin */
.aside{width:200px;flex:none;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
.aside .brand{font-size:18px;padding:0 8px 12px}
.aside button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;font-size:13px}
.aside button[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.aside .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.aside .cnt.hot{color:var(--danger);font-weight:700}
.amain{flex:1;min-width:0;display:flex;flex-direction:column}
.atop{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);gap:10px}
.atop h3{margin:0;font-family:var(--f-display);font-size:19px}
.abody{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tile.hot{border-color:var(--danger);background:var(--danger-soft)}
.tile.hot .v{color:var(--danger)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.funnel{display:flex;flex-direction:column;gap:6px;font-size:13px}
.funnel div{display:grid;grid-template-columns:80px 50px 1fr;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.funnel span.bar{height:10px;border-radius:3px;background:var(--accent)}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);flex:1;min-height:0}
.q{border-right:1px solid var(--line);overflow:auto}
.q button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 16px;text-align:left}
.q button[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.doc{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;align-items:center}
.docph{height:56px;border-radius:8px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .nav{border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;gap:10px}
  .nav .groups{display:none}
  .navsel{display:block}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
  .q{max-height:160px;border-right:0;border-bottom:1px solid var(--line)}
  .aside{display:none}
}
@media (max-width:480px){
  .phone{border-width:6px;border-radius:28px;height:700px}
  .stage{padding-block:16px}
}
@media (prefers-reduced-motion:no-preference){
  .content,.abody{animation:in .18s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>

function desk(active, inner){
  const A=[["admin","Dashboard",""],["verify","Verifikatsiya","12"],["","Moderatsiya","31"],["","Shikoyatlar","3"],["","SOS","1",1],["","Xavf signallari","4"],["","Foydalanuvchilar",""],["","Juftliklar",""],["","Uchrashuvlar",""],["","Kelishuvlar",""],["","Check-in",""],["","Sozlamalar",""],["","Audit",""],["","Analitika",""]];
  return `<div class="desk"><div class="aside"><div class="brand">Mehr Admin</div>
    ${A.map(([id,l,c,h])=>`<button ${id?`data-go="${id}"`:""} aria-current="${id===active}"><span>${l}</span><span class="cnt ${h?"hot":""}">${c}</span></button>`).join("")}
  </div><div class="amain">${inner}</div></div>`;
}

const EXTRA = {search:{t:"Qidiruv",d:"Filtrlar va lenta. Xavfsizlik filtrlari doim ishlaydi."},chatlist:{t:"Chatlar ro'yxati",d:"Faqat juftliklar bilan chat."},profile:{t:"Profil",d:"Yoshning o'z profili va sozlamalari."}};

function render(){
  const meta = SCREENS.find(s=>s.id===S.screen) || EXTRA[S.screen];
  document.getElementById("cap-t").textContent = (meta.n?meta.n+". ":"")+meta.t;
  document.getElementById("cap-d").textContent = meta.d;
  document.getElementById("frame").innerHTML = R[S.screen]();
  document.querySelectorAll("#groups button").forEach(b=>b.setAttribute("aria-current", b.dataset.go===S.screen));
  const sel=document.getElementById("navsel"); if(SCREENS.some(s=>s.id===S.screen)) sel.value=S.screen;
  const cb=document.getElementById("chatbox"); if(cb) cb.parentElement.scrollTop=1e6;
  const f=document.getElementById("composer");
  if(f) f.addEventListener("submit",e=>{e.preventDefault();const i=document.getElementById("msg");const t=i.value.trim();if(!t)return;
    const bad=/(\+?998[\s-]?\d{2}|\b\d{2}[\s-]?\d{3}[\s-]?\d{2}[\s-]?\d{2}\b|@[A-Za-z0-9_]{3,}|t\.me|https?:\/\/|www\.)/i.test(t);
    S.msgs.push(bad?{k:"held",t}:{k:"out",t,tm:new Date().toTimeString().slice(0,5)});render();setTimeout(()=>document.getElementById("msg")?.focus(),0);});
  try{localStorage.setItem("mehr-screen",S.screen)}catch(e){}
}
function go(id){ S.screen=id; S.toast=null; render(); }

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a){
    const v=a.dataset.v;
    switch(a.dataset.act){
      case "otp": S.otp=true; render(); return;
      case "role": S.role=v; render(); return;
      case "gender": S.gender=v; render(); return;
      case "tag": S.tags.has(v)?S.tags.delete(v):S.tags.add(v); render(); return;
      case "skill": S.skills.has(v)?S.skills.delete(v):S.skills.add(v); render(); return;
      case "interest": if(S.used<S.daily){S.used++;S.sent.add("karimov");} render(); return;
      case "accept": S.incoming=S.incoming.filter(f=>f.id!==v); S.toast="Juftlik yaratildi — endi chat ochiq."; render(); return;
      case "decline": S.incoming=S.incoming.filter(f=>f.id!==v); S.toast=null; render(); return;
      case "chk": S.check[v]=a.checked; render(); return;
      case "trial": S.trial=v; render(); return;
      case "agree": S.agree=a.checked; render(); return;
      case "sign": S.signed=true; render(); return;
      case "sos": S.sos=v; render(); return;
      case "sossend": S.sosSent=true; render(); return;
      case "sosreset": S.sosSent=false; S.sos=null; render(); return;
      case "asel": S.adminSel=+v; S.reason=false; render(); return;
    }
  }
  const g=e.target.closest("[data-go]");
  if(g && !g.disabled) go(g.dataset.go);
});
document.addEventListener("change",e=>{
  if(e.target.id==="why"){S.reason=!!e.target.value;render();}
  if(e.target.id==="minor"){S.minor=e.target.checked;render();}
  if(e.target.id==="navsel"){go(e.target.value);}
});

// Navigator
(function(){
  const groups={}; SCREENS.forEach(s=>(groups[s.g]=groups[s.g]||[]).push(s));
  document.getElementById("groups").innerHTML = Object.entries(groups).map(([g,list])=>`<div><h4>${g}</h4><ul>${list.map(s=>`<li><button data-go="${s.id}"><span class="n">${s.n}</span>${s.t}</button></li>`).join("")}</ul></div>`).join("");
  document.getElementById("navsel").innerHTML = SCREENS.map(s=>`<option value="${s.id}">${s.n}. ${s.t}</option>`).join("");
  try{const saved=localStorage.getItem("mehr-screen"); if(saved && R[saved]) S.screen=saved;}catch(e){}
  render();
})();
</script>
